CONFIG_VERSION=1

# Nom statique de la machine.
# Utiliser "disabled" pour ne pas modifier le hostname.
HOSTNAME=fedora

# Fonctionnement
# Confirme automatiquement les installations ordinaires et répond oui aux
# transactions DNF/Flatpak correspondantes. Les opérations sensibles restent
# interactives et les erreurs restent bloquantes.
AUTO_CONFIRM_SAFE_ACTIONS=true
# Répond aussi automatiquement aux confirmations sensibles et aux transactions
# DNF correspondantes (COPR, swaps et suppressions nécessaires).
# Les contrôles Secure Boot/matériel et les tests manuels CachyOS restent actifs.
AUTO_CONFIRM_ALL_ACTIONS=true
# Redémarre automatiquement quand Fedora le demande, sauf pendant le test CachyOS.
AUTO_REBOOT=true

# Applications
# Passer une application à false pour ne pas l'installer.
INSTALL_BRAVE=true
INSTALL_BITWARDEN=true
INSTALL_CLAMAV=true
# Interface GTK4/Adwaita moderne pour ClamAV, installée depuis Flathub.
# ClamUI nécessite ClamAV sur l'hôte ; le script l'ajoutera s'il manque.
INSTALL_CLAMUI=true
INSTALL_PINTA=true
INSTALL_UPSCAYL=true
INSTALL_MPV=true
INSTALL_RUSTDESK=true
# Interface Flatpak facultative pour gérer les AppImage.
INSTALL_GEARLEVER=true
# Suite bureautique installée depuis Flathub pour bénéficier des mises à jour
# automatiques et éviter l'ajout d'un dépôt RPM tiers.
INSTALL_ONLYOFFICE=true

# Nettoyage des applications Fedora préinstallées
# Chaque option true confirme explicitement la suppression correspondante.
# Les paquets réellement installés sont regroupés dans une seule transaction,
# puis DNF supprime les dépendances devenues inutiles avec autoremove.
SUPPRESSION_MEDIA_WRITER=true
SUPPRESSION_CARTES=true
SUPPRESSION_LIBREOFFICE=true
SUPPRESSION_NUMERISEUR=true
SUPPRESSION_MACHINES=true
SUPPRESSION_CAMERA=true
SUPPRESSION_CONNEXIONS=true
SUPPRESSION_CONTROLE_PARENTAL=true
SUPPRESSION_VISITE_GUIDEE=true
SUPPRESSION_AIDE=true
# Le lecteur vidéo Fedora est retiré seulement si INSTALL_MPV=true et MPV est installé.
# Firefox est retiré seulement si INSTALL_BRAVE=true et Brave est installé.

# Développement
INSTALL_VSCODE=true
# Fork Linux communautaire de GitHub Desktop, installé depuis Flathub.
INSTALL_DESKTOP_PLUS=true
INSTALL_BRUNO=true
# Inclut le service, le test hello-world et l'ajout au groupe docker.
# Le groupe docker accorde des privilèges comparables à root.
INSTALL_DOCKER=true
# Installe Node.js 24 LTS avec NVM, puis pnpm.
INSTALL_NODE=true
# Installe RTK sans configurer d'assistant IA.
INSTALL_RTK=true
INSTALL_CLI_TOOLS=true

# Jeux
# Steam utilise RPM Fusion ; Heroic utilise Flathub.
INSTALL_STEAM=true
INSTALL_LUTRIS=true
INSTALL_HEROIC=true
INSTALL_GAMEMODE=true
INSTALL_GAMESCOPE=true

# Pilotes
# auto sélectionne la branche RPM Fusion compatible ; disabled n'installe rien.
NVIDIA_DRIVER=auto
# Codecs et accélération vidéo adaptés au matériel détecté.
INSTALL_HARDWARE_CODECS=true

# CachyOS — Expérimental
# À tester de préférence sur un PC secondaire. Secure Boot doit être désactivé.
# Le premier démarrage sur CachyOS devra être sélectionné manuellement dans GRUB.
INSTALL_CACHYOS=false
# Pris en compte uniquement si INSTALL_CACHYOS=true.
# Installe cachyos-settings (ZRAM), scx-scheds/tools/manager et ananicy-cpp.
INSTALL_CACHYOS_ADDONS=true
# Après les tests CachyOS réussis, réactive le masquage conditionnel de GRUB.
# Fedora continue d'afficher GRUB en multiboot ou après un démarrage échoué.
HIDE_GRUB_AFTER_CACHYOS=true

# Profil GNOME et Zsh
# Applique les polices, Papirus-Dark, le mode sombre et les préférences GNOME
# génériques de ce projet. Les écrans, périphériques et données privées sont exclus.
APPLY_THEME=true
# Installe les extensions compatibles GNOME 50 depuis Fedora lorsque possible,
# sinon depuis extensions.gnome.org avec une version et un SHA-256 figés.
# Une déconnexion/reconnexion sera nécessaire pour charger les nouvelles extensions.
APPLY_GNOME_EXTENSIONS=true
# Ajoute un bloc géré à ~/.zshrc sans remplacer les alias ou fonctions personnels.
# Oh My Zsh, NVM, fzf et zoxide ne sont chargés que lorsqu'ils sont disponibles.
APPLY_ZSH_CONFIG=true
